name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      LOUPE_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - run: swift test

      - name: Import signing certificate
        env:
          CERTIFICATE: ${{ secrets.SIGNING_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        shell: bash
        run: |
          [[ -n "$CERTIFICATE" ]] || { echo "::error::Add the SIGNING_CERTIFICATE secret so releases can update themselves"; exit 1; }
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          identity="$(security find-identity -p codesigning "$keychain" | sed -n 's/^ *1) [0-9A-F]* "\([^"]*\)".*/\1/p' | head -1)"
          [[ -n "$identity" ]] || { echo "::error::SIGNING_CERTIFICATE has no code signing identity"; exit 1; }
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          if [[ "$identity" != "Developer ID Application"* ]]; then
            security find-certificate -c "$identity" -p "$keychain" > "$RUNNER_TEMP/certificate.pem"
            sudo security add-trusted-cert -d -r trustRoot -p codeSign -k "$keychain" "$RUNNER_TEMP/certificate.pem"
          fi
          echo "LOUPE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "LOUPE_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          if [[ "$identity" == "Developer ID Application"* && -n "$NOTARY_APPLE_ID" ]]; then
            xcrun notarytool store-credentials loupe --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --keychain "$keychain"
            echo "LOUPE_NOTARY_PROFILE=loupe" >> "$GITHUB_ENV"
            echo "LOUPE_NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          fi

      - name: Package
        shell: bash
        run: |
          LOUPE_VERSION="${LOUPE_VERSION#v}" ./scripts/package.sh
          cd dist && shasum -a 256 Loupe-*.dmg > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/Loupe-*.dmg dist/SHA256SUMS.txt --title "Loupe ${GITHUB_REF_NAME#v}" --generate-notes "${flags[@]}"
